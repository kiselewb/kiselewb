<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" width="760" height="390" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">VPN platform architecture</title>
  <desc id="d">A Telegram bot talks to a FastAPI backend over HTTP. The backend uses PostgreSQL, manages an Xray server, receives payment webhooks and publishes events to RabbitMQ, which delivers notifications back to the bot.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .t { fill: #f1f5f9; font-size: 13px; font-weight: 600; text-anchor: middle; }
    .s { fill: #94a3b8; font-size: 10.5px; text-anchor: middle; }
    .l { fill: #94a3b8; font-size: 10px; }
  </style>

  <rect width="760" height="390" rx="12" fill="#0f172a"/>

  <!-- connections -->
  <g fill="none" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arrow)">
    <path d="M115 170 H148"/>
    <path d="M280 170 H328"/>
    <path d="M380 245 V308"/>
    <path d="M265 335 H215 V202"/>
    <path d="M520 135 H552 V65 H583"/>
    <path d="M520 175 H583"/>
    <path d="M585 295 H552 V215 H522"/>
  </g>

  <!-- nodes -->
  <g fill="#1e293b" stroke="#475569" stroke-width="1.2">
    <rect x="15" y="140" width="100" height="60" rx="8"/>
    <rect x="150" y="140" width="130" height="60" rx="8"/>
    <rect x="265" y="310" width="180" height="50" rx="8"/>
    <rect x="585" y="40" width="150" height="50" rx="8"/>
    <rect x="585" y="150" width="150" height="50" rx="8"/>
    <rect x="585" y="270" width="150" height="50" rx="8"/>
  </g>
  <rect x="330" y="105" width="190" height="140" rx="10" fill="#312e81" stroke="#818cf8" stroke-width="1.5"/>

  <!-- node text -->
  <text class="t" x="65" y="165">User</text>
  <text class="s" x="65" y="183">Telegram</text>

  <text class="t" x="215" y="165">Telegram bot</text>
  <text class="s" x="215" y="183">aiogram 3 · FSM</text>

  <text class="t" x="425" y="132">FastAPI backend</text>
  <text class="s" x="425" y="154">Router → Service → Repository</text>
  <text class="s" x="425" y="172">Pydantic v2 · async SQLAlchemy</text>
  <text class="s" x="425" y="190">Subscriptions · Payments</text>
  <text class="s" x="425" y="208">APScheduler jobs</text>

  <text class="t" x="355" y="332">RabbitMQ</text>
  <text class="s" x="355" y="349">aio-pika · events</text>

  <text class="t" x="660" y="62">PostgreSQL</text>
  <text class="s" x="660" y="79">SQLAlchemy · Alembic</text>

  <text class="t" x="660" y="172">Xray server</text>
  <text class="s" x="660" y="189">VLESS + Reality</text>

  <text class="t" x="660" y="292">Payment providers</text>
  <text class="s" x="660" y="309">Platega · Telegram Stars</text>

  <!-- labels -->
  <text class="l" x="304" y="162" text-anchor="middle">HTTP</text>
  <text class="l" x="390" y="282">events</text>
  <text class="l" x="207" y="300" text-anchor="end">notifications</text>
  <text class="l" x="552" y="168" text-anchor="middle">Xray API</text>
  <text class="l" x="545" y="262" text-anchor="end">webhooks</text>
  <text class="l" x="15" y="372">The bot never touches the database: it talks to the API over HTTP.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
